<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshFold — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="notifications.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">FreshFold</div>
  <nav class="nav">
    <a href="dashboard.html">Home</a>
    <a href="book.html">Book a service</a>
    <a href="history.html">Orders</a>
    <a href="notifications.html" class="active">Notifications</a>
  </nav>
  <div class="user-chip">
    <span class="avatar">JD</span>
    <span class="user-name">Juan D.</span>
  </div>
</header>

<main class="page">

  <div class="page-head">
    <div>
      <h1>Notifications</h1>
      <p class="sub">Updates on your orders, payments, and account.</p>
    </div>
    <button class="btn-ghost" id="mark-all">Mark all as read</button>
  </div>

  <div class="filter-row" role="tablist" aria-label="Filter notifications">
    <button class="filter-chip selected" data-filter="all">All</button>
    <button class="filter-chip" data-filter="unread">Unread</button>
  </div>

  <div id="notif-container">
    <p class="empty-state">Loading notifications…</p>
  </div>

  <p class="empty-state" id="empty-state" hidden>You're all caught up — no unread notifications.</p>

</main>

<script src="api.js"></script>
<script src="notifications.js"></script>
</body>
</html>
