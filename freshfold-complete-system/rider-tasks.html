<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshFold Rider — Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rider-tasks.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">FreshFold <span class="tag">Rider</span></div>
  <nav class="nav">
    <a href="rider-tasks.html" class="active">Tasks</a>
    <a href="rider-task-history.html">Task history</a>
  </nav>
  <div class="user-chip">
    <span class="avatar">MA</span>
    <span class="user-name">Mark A.</span>
  </div>
</header>

<main class="page">

  <div class="page-head">
    <div>
      <h1>Today's tasks</h1>
      <p class="sub">3 tasks assigned to you for Sep 10, 2026.</p>
    </div>
    <span class="shift-badge">On shift</span>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-value" id="stat-pickups">—</span>
      <span class="stat-label">Pickups pending</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-deliveries">—</span>
      <span class="stat-label">Deliveries pending</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-completed">—</span>
      <span class="stat-label">Completed today</span>
    </div>
  </div>

  <div class="filter-row" role="tablist" aria-label="Filter tasks">
    <button class="filter-chip selected" data-filter="all">All</button>
    <button class="filter-chip" data-filter="pickup">Pickups</button>
    <button class="filter-chip" data-filter="delivery">Deliveries</button>
  </div>

  <div class="task-list" id="task-list">
    <p class="empty-state">Loading today's tasks…</p>
  </div>

  <p class="empty-state" id="empty-state" hidden>No tasks in this category.</p>

</main>

<script src="api.js"></script>
<script src="rider-tasks.js"></script>
</body>
</html>
